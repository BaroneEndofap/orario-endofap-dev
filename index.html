<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orario Lezioni — Endofap Sicilia</title>
  <style>
    /* ── Reset & Base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      background: #eef2f7;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* ── Variabili colori (coerenti con totem.css) ─────────────────────────── */
    :root {
      --blu-scuro : #1a3a5c;
      --blu       : #2c5282;
      --blu-light : #dbeafe;
      --blu-pale  : #f0f7ff;
      --oro       : #e8a838;
      --bg        : #eef2f7;
      --border    : #e2e8f0;
      --text-main : #1e293b;
      --text-sub  : #475569;
      --text-muted: #94a3b8;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .site-header {
      background: linear-gradient(135deg, var(--blu-scuro) 0%, var(--blu) 100%);
      border-bottom: 4px solid var(--oro);
      padding: .9rem 1.25rem .8rem;
      display: flex;
      align-items: center;
      gap: .85rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      height: 42px;
      width: auto;
      flex-shrink: 0;
    }
    .header-text { flex: 1; min-width: 0; }
    .header-school {
      font-size: .68rem;
      font-weight: 700;
      color: var(--oro);
      letter-spacing: .1em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .06em;
      line-height: 1.2;
    }
    .header-meta {
      font-size: .72rem;
      color: #bdd5ea;
      margin-top: .15rem;
    }

    /* ── Tab bar ───────────────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      background: var(--blu-scuro);
      border-bottom: 3px solid var(--blu);
    }
    .tab-btn {
      flex: 1;
      padding: .65rem .5rem;
      border: none;
      background: none;
      font-family: inherit;
      font-weight: 700;
      font-size: .88rem;
      color: #bdd5ea;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -3px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--oro);
    }

    /* ── Ricerca ───────────────────────────────────────────────────────────── */
    .search-wrap {
      padding: .75rem 1rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .search-wrap input {
      width: 100%;
      border: 1.5px solid #c8d8ea;
      border-radius: 2rem;
      padding: .45rem 1rem;
      font-family: inherit;
      font-size: .9rem;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: var(--blu); }

    /* ── Lista entità ──────────────────────────────────────────────────────── */
    .entity-list { padding-bottom: 1rem; }

    .entity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
    }
    .entity-item:hover, .entity-item:active { background: var(--blu-pale); }
    .entity-name  { font-weight: 600; font-size: .95rem; color: var(--text-main); }
    .entity-right { display: flex; align-items: center; gap: .6rem; }
    .entity-count {
      font-size: .75rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: .1rem .55rem;
    }
    .entity-arrow { color: var(--blu); font-size: 1rem; font-weight: 700; }

    /* ── Pagina dettaglio ──────────────────────────────────────────────────── */
    #dettaglio { display: none; padding-bottom: 2rem; }

    .detail-header {
      background: linear-gradient(135deg, var(--blu-scuro) 0%, var(--blu) 100%);
      border-bottom: 3px solid var(--oro);
      padding: .75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: .75rem;
      position: sticky;
      top: 0;
      z-index: 99;
    }
    .back-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      color: #fff;
      font-size: 1rem;
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s;
    }
    .back-btn:hover { background: rgba(255,255,255,.25); }
    .detail-name {
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .05em;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail-dal {
      font-size: .72rem;
      color: var(--oro);
      white-space: nowrap;
    }

    /* ── Card giorno ───────────────────────────────────────────────────────── */
    .day-section { margin: .85rem 1rem 0; }

    .day-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--blu-scuro);
      background: var(--blu-light);
      border-radius: .5rem .5rem 0 0;
      padding: .45rem .9rem;
      border-bottom: 2px solid #93c5fd;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 2.5rem;
    }

    /* Oggi highlight */
    .day-section.today .day-label {
      background: var(--blu);
      color: #fff;
      border-bottom-color: var(--oro);
    }
    .today-pill {
      display: none;
      background: rgba(255,255,255,.25);
      color: #fff;
      border-radius: 1rem;
      padding: .05rem .45rem;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .03em;
      vertical-align: middle;
      margin-left: .4rem;
      text-transform: none;
    }
    .day-chevron {
      font-size: .55rem;
      opacity: .55;
      transition: transform .2s;
      flex-shrink: 0;
      margin-left: .5rem;
    }
    .day-section.collapsed .day-chevron { transform: rotate(-90deg); }

    /* Collaps */
    .day-collapse {
      overflow: hidden;
      transition: max-height .25s ease;
    }
    .day-section.collapsed .day-collapse { max-height: 0 !important; }

    .day-body {
      background: #fff;
      border-radius: 0 0 .5rem .5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: none;
    }

    /* Btn "Vai ad oggi" */
    #btn-oggi {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--blu);
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: .55rem 1.1rem;
      font-size: .8rem;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 10px rgba(0,0,0,.28);
      cursor: pointer;
      z-index: 200;
      display: none;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: .03em;
    }
    #btn-oggi:active { background: var(--blu-scuro); }

    /* ── Riga slot ─────────────────────────────────────────────────────────── */
    .slot-row {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      padding: .6rem .9rem;
      border-top: 1px solid var(--border);
      border-left: 4px solid var(--blu);
    }
    .slot-row:first-child { border-top: none; }

    .slot-time {
      min-width: 3.4rem;
      text-align: center;
      flex-shrink: 0;
    }
    .slot-time .t-da   { font-weight: 700; font-size: .8rem; color: var(--text-main); display: block; }
    .slot-time .t-a    { font-size: .7rem; color: var(--text-muted); display: block; }

    .slot-body { flex: 1; min-width: 0; }

    .slot-tag {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--blu);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .1rem;
    }
    .slot-main {
      font-weight: 600;
      font-size: .9rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-sub {
      font-size: .77rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-aula {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      margin-top: .2rem;
      font-size: .72rem;
      font-weight: 600;
      color: var(--blu);
      background: var(--blu-light);
      border: 1px solid #93c5fd;
      border-radius: .9rem;
      padding: .05rem .45rem;
    }
    .slot-aula::before { content: '📍'; font-size: .65rem; }

    /* Ora divisa */
    .slot-divisa + .slot-divisa {
      margin-top: .35rem;
      padding-top: .35rem;
      border-top: 1px dashed #e2e8f0;
    }

    /* Giorno vuoto */
    .day-empty {
      padding: .5rem .9rem;
      font-size: .82rem;
      color: var(--text-muted);
    }

    /* ── Sostituzioni docenti ──────────────────────────────────────────────── */
    .sost-box {
      margin: .75rem 1rem 0;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-left: 4px solid #ea580c;
      border-radius: .5rem;
      padding: .6rem .85rem;
      font-size: .85rem;
    }
    .sost-box h3 { font-size: .9rem; color: #9a3412; margin-bottom: .35rem; }
    .sost-giorno { font-weight: 700; color: #9a3412; margin-top: .45rem; }
    .sost-riga { padding: .2rem 0; border-top: 1px dashed #fed7aa; color: var(--text-main); }
    .sost-riga small { color: var(--text-sub); }
    .sost-riga strong { color: #c2410c; }

    .slot-sost {
      margin-top: .25rem;
      font-size: .75rem;
      font-weight: 600;
      color: #9a3412;
      background: #ffedd5;
      border: 1px solid #fed7aa;
      border-radius: .4rem;
      padding: .1rem .45rem;
    }

    /* ── Messaggi ──────────────────────────────────────────────────────────── */
    .empty-msg {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
      font-size: .9rem;
      line-height: 1.6;
    }
    .empty-msg .icon { font-size: 2.5rem; display: block; margin-bottom: .5rem; opacity: .5; }

    /* ── Footer aggiornamento ──────────────────────────────────────────────── */
    .update-footer {
      background: var(--blu-scuro);
      border-top: 3px solid var(--blu);
      padding: .55rem 1.25rem;
      text-align: center;
      font-size: .72rem;
      color: #bdd5ea;
    }
    .update-footer strong { color: var(--oro); }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <div class="header-text">
    <div class="header-school">Endofap Sicilia</div>
    <div class="header-title">Orario Lezioni</div>
    <div class="header-meta" id="hdr-meta">Caricamento…</div>
  </div>
</header>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-docenti" onclick="switchTab('docenti')">&#128100; Docenti</button>
  <button class="tab-btn"        id="tab-corsi"   onclick="switchTab('corsi')">&#127979; Corsi</button>
</div>

<!-- Vista lista -->
<div id="lista-view">
  <div id="sost-banner"></div>
  <div class="search-wrap">
    <input type="search" id="search-input" placeholder="Cerca…" oninput="filterList()" autocomplete="off">
  </div>
  <div class="entity-list" id="entity-list"></div>
</div>

<!-- Vista dettaglio -->
<div id="dettaglio">
  <div class="detail-header">
    <button class="back-btn" onclick="showList()" title="Torna alla lista">&#8592;</button>
    <div class="detail-name" id="detail-name"></div>
    <div class="detail-dal" id="detail-dal"></div>
  </div>
  <div id="detail-grid"></div>
</div>

<!-- Btn Oggi (visibile nel dettaglio) -->
<button id="btn-oggi" onclick="scrollToToday()">&#8593; Oggi</button>

<!-- Footer -->
<div class="update-footer" id="update-footer" style="display:none">
  Aggiornato il <strong id="footer-ts"></strong>
</div>

<script>
const DAYS      = {LUN:'Lunedì', MAR:'Martedì', MER:'Mercoledì', GIO:'Giovedì', VEN:'Venerdì'};
const DAY_ORDER = ['LUN','MAR','MER','GIO','VEN'];

let orario     = null;
let currentTab = 'docenti';

/* ── Caricamento dati ──────────────────────────────────────────────────── */
async function loadData() {
  try {
    const res = await fetch('data/orario.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    orario = await res.json();

    const dt  = new Date(orario.aggiornato);
    const fmtDate = dt.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
    const fmtTime = dt.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});

    document.getElementById('hdr-meta').textContent =
      'A.F. ' + orario.anno_formativo + '  ·  Dal ' + orario.dal;

    document.getElementById('footer-ts').textContent = fmtDate + ' alle ' + fmtTime;
    document.getElementById('update-footer').style.display = 'block';

    renderSostBanner();
    renderList();
  } catch (e) {
    document.getElementById('entity-list').innerHTML =
      '<div class="empty-msg"><span class="icon">&#9888;&#65039;</span>' +
      'Impossibile caricare i dati.<br><small>' + esc(e.message) + '</small></div>';
    document.getElementById('hdr-meta').textContent = '';
  }
}

/* ── Sostituzioni docenti (valide da oggi in avanti) ───────────────────── */
function isoOggi() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function sostAttive() {
  const oggi = isoOggi();
  return ((orario && orario.sostituzioni) || []).filter(s => s.data >= oggi);
}

function fmtDataIt(iso) {
  const p = iso.split('-');
  const g = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'][new Date(iso + 'T12:00:00').getDay()];
  return g + ' ' + p[2] + '/' + p[1];
}

/* Elenco sostituzioni raggruppato per data; `ruolo` evidenzia l'altra parte in causa */
function sostHtml(lista, titolo) {
  if (!lista.length) return '';
  const perData = {};
  lista.forEach(s => (perData[s.data] = perData[s.data] || []).push(s));
  const oggi = isoOggi();
  return '<div class="sost-box"><h3>' + esc(titolo) + '</h3>' +
    Object.keys(perData).sort().map(d =>
      '<div class="sost-giorno">' + esc(fmtDataIt(d)) + (d === oggi ? ' · oggi' : '') + '</div>' +
      perData[d].map(s =>
        '<div class="sost-riga">' + esc(s.da) + '–' + esc(s.a) + ' · ' + esc(s.corso) +
        '<br><strong>' + esc(s.docente_sostituto) + '</strong> <small>al posto di ' + esc(s.docente_assente) +
        (s.materia ? ' (' + esc(s.materia) + ')' : '') + (s.aula ? ' · aula ' + esc(s.aula) : '') + '</small></div>'
      ).join('')
    ).join('') + '</div>';
}

function renderSostBanner() {
  document.getElementById('sost-banner').innerHTML = sostHtml(sostAttive(), 'Sostituzioni docenti');
}

/* Etichette "sostituito da…" per una lezione: una per ogni data futura con sostituzione.
   `docente` = chi era in orario; `perDocente` = true nella griglia del docente (mostra chi lo sostituisce),
   false nella griglia del corso (mostra chi sostituisce). */
function sostSlot(corso, giorno, da, docente, perDocente) {
  return sostAttive()
    .filter(s => s.corso === corso && s.giorno === giorno && s.da === da && s.docente_assente === docente)
    .map(s => '<div class="slot-sost">' + esc(fmtDataIt(s.data)) + ' · ' +
      (perDocente ? 'sostituito da ' : 'sostituisce ') + '<strong>' + esc(s.docente_sostituto) + '</strong>' +
      (perDocente ? '' : ' (al posto di ' + esc(s.docente_assente) + ')') +
      (s.aula ? ' · aula ' + esc(s.aula) : '') + '</div>')
    .join('');
}

function sostPerEntita(nome) {
  const lista = sostAttive().filter(s => currentTab === 'corsi'
    ? s.corso === nome
    : (s.docente_assente === nome || s.docente_sostituto === nome));
  return sostHtml(lista, 'Sostituzioni');
}

/* ── Tab ───────────────────────────────────────────────────────────────── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-docenti').classList.toggle('active', tab === 'docenti');
  document.getElementById('tab-corsi').classList.toggle('active',   tab === 'corsi');
  document.getElementById('search-input').value = '';
  showList();
  renderList();
}

/* ── Lista ─────────────────────────────────────────────────────────────── */
function renderList() {
  if (!orario) return;
  const q      = document.getElementById('search-input').value.toLowerCase().trim();
  const data   = orario[currentTab];
  const items  = q ? data.filter(e => e.nome.toLowerCase().includes(q)) : data;

  if (!items.length) {
    document.getElementById('entity-list').innerHTML =
      '<div class="empty-msg"><span class="icon">&#128269;</span>Nessun risultato.</div>';
    return;
  }

  document.getElementById('entity-list').innerHTML = items.map(e => {
    const n     = currentTab === 'docenti' ? e.slots.length : e.lezioni.length;
    const label = currentTab === 'docenti'
      ? (n === 1 ? '1 ora' : n + ' ore')
      : (n === 1 ? '1 lezione' : n + ' lezioni');
    return `<div class="entity-item" onclick="showDetail('${esc(e.nome)}')">
      <span class="entity-name">${esc(e.nome)}</span>
      <span class="entity-right">
        <span class="entity-count">${label}</span>
        <span class="entity-arrow">&#8250;</span>
      </span>
    </div>`;
  }).join('');
}

function filterList() { renderList(); }

/* ── Dettaglio ─────────────────────────────────────────────────────────── */
function showDetail(nome) {
  if (!orario) return;
  const entity = orario[currentTab].find(e => e.nome === nome);
  if (!entity) return;

  document.getElementById('detail-name').textContent = nome;
  document.getElementById('detail-dal').textContent  = 'Dal ' + orario.dal;
  document.getElementById('detail-grid').innerHTML   = sostPerEntita(nome) +
    (currentTab === 'docenti' ? buildDocenteGrid(entity) : buildCorsoGrid(entity));

  document.getElementById('lista-view').style.display = 'none';
  document.getElementById('dettaglio').style.display  = 'block';
  document.getElementById('update-footer').style.display = 'none';
  window.scrollTo(0, 0);
  initDaySections();
}

function showList() {
  document.getElementById('dettaglio').style.display  = 'none';
  document.getElementById('lista-view').style.display = 'block';
  document.getElementById('update-footer').style.display = 'block';
  document.getElementById('btn-oggi').style.display   = 'none';
}

/* ── Griglia docente ───────────────────────────────────────────────────── */
function buildDocenteGrid(entity) {
  const byDay = groupByDay(entity.slots);
  return DAY_ORDER.map(day => {
    const slots = sortByTime(byDay[day] || []);
    const rows  = slots.length
      ? slots.map(s => `
        <div class="slot-row">
          <div class="slot-time">
            <span class="t-da">${s.da}</span>
            <span class="t-a">${s.a}</span>
          </div>
          <div class="slot-body">
            <div class="slot-tag">${esc(s.corso)}</div>
            <div class="slot-main">${esc(s.materia)}</div>
            ${s.aula ? `<div class="slot-aula">${esc(s.aula)}</div>` : ''}
            ${sostSlot(s.corso, day, s.da, entity.nome, true)}
          </div>
        </div>`).join('')
      : '<div class="day-empty">Nessuna lezione</div>';
    return `<div class="day-section" data-day="${day}">
      <div class="day-label"><span>${DAYS[day]}<span class="today-pill">Oggi</span></span><span class="day-chevron">&#9660;</span></div>
      <div class="day-collapse"><div class="day-body">${rows}</div></div>
    </div>`;
  }).join('');
}

/* ── Griglia corso ─────────────────────────────────────────────────────── */
function buildCorsoGrid(entity) {
  const byDay = groupByDay(entity.lezioni);
  return DAY_ORDER.map(day => {
    const slots = sortByTime(byDay[day] || []);
    const rows  = slots.length
      ? slots.map(l => {
          if (l.tipo === 'divisa') {
            return `<div class="slot-row">
              <div class="slot-time">
                <span class="t-da">${l.da}</span>
                <span class="t-a">${l.a}</span>
              </div>
              <div class="slot-body">
                <div class="slot-divisa">
                  <div class="slot-main">${esc(l.materia)}</div>
                  <div class="slot-sub">${esc(l.docente)}</div>
                  ${l.aula  ? `<div class="slot-aula">${esc(l.aula)}</div>`  : ''}
                  ${sostSlot(entity.nome, day, l.da, l.docente, false)}
                </div>
                <div class="slot-divisa">
                  <div class="slot-main">${esc(l.materia2)}</div>
                  <div class="slot-sub">${esc(l.docente2)}</div>
                  ${l.aula2 ? `<div class="slot-aula">${esc(l.aula2)}</div>` : ''}
                  ${sostSlot(entity.nome, day, l.da, l.docente2, false)}
                </div>
              </div>
            </div>`;
          }
          return `<div class="slot-row">
            <div class="slot-time">
              <span class="t-da">${l.da}</span>
              <span class="t-a">${l.a}</span>
            </div>
            <div class="slot-body">
              <div class="slot-main">${esc(l.materia)}</div>
              <div class="slot-sub">${esc(l.docente)}</div>
              ${l.aula ? `<div class="slot-aula">${esc(l.aula)}</div>` : ''}
              ${sostSlot(entity.nome, day, l.da, l.docente, false)}
            </div>
          </div>`;
        }).join('')
      : '<div class="day-empty">Nessuna lezione</div>';
    return `<div class="day-section" data-day="${day}">
      <div class="day-label"><span>${DAYS[day]}<span class="today-pill">Oggi</span></span><span class="day-chevron">&#9660;</span></div>
      <div class="day-collapse"><div class="day-body">${rows}</div></div>
    </div>`;
  }).join('');
}

/* ── Inizializza sezioni giorno (oggi + collasso + toggle) ─────────────── */
function initDaySections() {
  const DAY_MAP  = {1:'LUN', 2:'MAR', 3:'MER', 4:'GIO', 5:'VEN'};
  const todayCode = DAY_MAP[new Date().getDay()];
  const isMobile  = window.matchMedia('(max-width:639px)').matches;

  document.querySelectorAll('#detail-grid .day-section').forEach(function(sec) {
    var collapse = sec.querySelector('.day-collapse');
    if (collapse) collapse.style.maxHeight = collapse.scrollHeight + 'px';

    if (sec.dataset.day === todayCode) {
      sec.classList.add('today');
      var pill = sec.querySelector('.today-pill');
      if (pill) pill.style.display = 'inline-block';
    } else if (isMobile) {
      sec.classList.add('collapsed');
    }

    sec.querySelector('.day-label').addEventListener('click', function() {
      var c = sec.querySelector('.day-collapse');
      if (sec.classList.contains('collapsed')) {
        sec.classList.remove('collapsed');
        if (c) c.style.maxHeight = c.scrollHeight + 'px';
      } else {
        sec.classList.add('collapsed');
      }
    });
  });

  var todayEl = document.querySelector('#detail-grid .day-section.today');
  var btnOggi = document.getElementById('btn-oggi');
  if (todayEl) {
    if (btnOggi) btnOggi.style.display = 'block';
    setTimeout(function() { todayEl.scrollIntoView({behavior:'smooth', block:'start'}); }, 120);
  } else {
    if (btnOggi) btnOggi.style.display = 'none';
  }
}

window.scrollToToday = function() {
  var todayEl = document.querySelector('#detail-grid .day-section.today');
  if (!todayEl) return;
  todayEl.querySelector('.day-collapse') && document.querySelector('#detail-grid .day-section.today').classList.remove('collapsed');
  var c = todayEl.querySelector('.day-collapse');
  if (c) c.style.maxHeight = c.scrollHeight + 'px';
  todayEl.scrollIntoView({behavior:'smooth', block:'start'});
};

/* ── Utility ───────────────────────────────────────────────────────────── */
function groupByDay(slots) {
  const m = {};
  for (const s of slots) (m[s.giorno] = m[s.giorno] || []).push(s);
  return m;
}
function sortByTime(slots) {
  return [...slots].sort((a, b) => a.da.localeCompare(b.da));
}
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Avvio ─────────────────────────────────────────────────────────────── */
loadData();
</script>
